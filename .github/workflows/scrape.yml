name: Scrape pending movies
on:
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.CLONE_TOKEN }}@github.com/filimafsomali/nexus.git bot
      - name: Setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json
      - name: Install deps
        working-directory: bot
        run: |
          npm ci
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Process
        working-directory: bot
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL || secrets.TUFAAX_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm start -- --all > /dev/null 2>&1
