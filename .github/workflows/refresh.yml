name: Refresh
on:
  workflow_dispatch:
  repository_dispatch:
    types: [dispatch-v1]

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Clone
        run: git clone --depth 1 ${{ secrets.CLONE_URL }} vendor

      - name: Setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vendor/package-lock.json

      - name: Install tools
        run: |
          if [ ! -f .ci/pkgs.txt ]; then echo "pkgs.txt missing" >&2; exit 1; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq $(cat .ci/pkgs.txt)

      - name: Install deps
        working-directory: vendor
        run: npm ci

      - name: Process
        working-directory: vendor
        env:
          CFG_A1: ${{ secrets.CFG_A1 }}
          CFG_A2: ${{ secrets.CFG_A2 }}
          CFG_A3: ${{ secrets.CFG_A3 }}
          CFG_A4: ${{ secrets.CFG_A4 }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          CFG_B1: ${{ secrets.CFG_B1 }}
          CFG_B2: ${{ secrets.CFG_B2 }}
          CFG_B3: ${{ secrets.CFG_B3 }}
          CFG_B4: ${{ secrets.CFG_B4 }}
          CFG_B5: ${{ secrets.CFG_B5 }}
          ITEM_ID: ${{ github.event.client_payload.item_id }}
          MSG_ID: ${{ github.event.client_payload.msg_id }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: npm run run > /dev/null
