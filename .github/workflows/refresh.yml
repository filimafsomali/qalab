name: Refresh
on:
  workflow_dispatch:
  repository_dispatch:
    types: [tg-refresh-link]

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone
        run: git clone --depth 1 https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/filimafsomali/tufaax-content-service.git bot

      - name: Setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install deps
        working-directory: bot
        run: npm ci

      - name: Process
        working-directory: bot
        env:
          CFG_A1: ${{ secrets.CFG_A1 }}
          CFG_A2: ${{ secrets.CFG_A2 }}
          CFG_A3: ${{ secrets.CFG_A3 }}
          CFG_A4: ${{ secrets.CFG_A4 }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          TUFAAX_BASE_URL: ${{ secrets.TUFAAX_BASE_URL }}
          CFG_B1: ${{ secrets.CFG_B1 }}
          CFG_B2: ${{ secrets.CFG_B2 }}
          CFG_B3: ${{ secrets.CFG_B3 }}
          CFG_B4: ${{ secrets.CFG_B4 }}
          CFG_B5: ${{ secrets.CFG_B5 }}
          MOVIE_ID: ${{ github.event.client_payload.movie_id }}
          TG_MESSAGE_ID: ${{ github.event.client_payload.tg_message_id }}
          TMDB_ID: ${{ github.event.client_payload.tmdb_id }}
          TITLE: ${{ github.event.client_payload.title }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: npm run tg-refresh
